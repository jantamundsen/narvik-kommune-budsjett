name: Oppdater data fra SSB

on:
  schedule:
    # SSB publiserer KOSTRA-regnskap i mars (foreløpig) og juni (endelig). Kjører 1. april og 20. juni.
    - cron: "0 6 1 4 *"
    - cron: "0 6 20 6 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent tall fra SSB
        run: python scripts/fetch_data.py
      - name: Commit hvis dataene er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add site/data/narvik.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i dataene."
          else
            git commit -m "Oppdater data fra SSB"
            git push
          fi
