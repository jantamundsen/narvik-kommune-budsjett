name: Oppdater data fra SSB

on:
  schedule:
    # SSB publiserer KOSTRA-regnskap i mars (foreløpig) og juni (endelig), og skatteinngangen (tabell 07022) midt i hver måned.
    # Nav publiserer ledighet og ledige stillinger tidlig i hver måned.
    # Kjører hver fredag morgen (06:00 UTC), så nye tall er inne før den ukentlige dokumentsjekken kl. 13.
    # Det blir bare en commit når tallene faktisk er endret.
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent tall fra SSB, Nav, Helsedirektoratet og Brønnøysundregistrene
        run: |
          python scripts/fetch_data.py
          python scripts/fetch_details.py
          python scripts/fetch_malgruppe.py
          python scripts/fetch_eldre.py
          python scripts/fetch_lopende.py
          python scripts/build_fakta.py
          python scripts/build_saker.py
          python scripts/build_andre_tall.py
          python scripts/fetch_befolkning.py
          python scripts/fetch_finans.py
          python scripts/fetch_bolig.py
          python scripts/fetch_arbeid.py
          python scripts/fetch_naering.py
          python scripts/build_sammenhenger.py
          python scripts/build_pages.py
      - name: Behold filer der bare datoen er endret
        run: python scripts/keep_unchanged.py site/data/*.json
      - name: Commit hvis dataene er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add site/data/narvik.json site/data/detaljer.json site/data/sammenligning.json site/data/malgruppe.json site/data/eldre.json site/data/lopende.json site/data/fakta.json site/data/saker.json site/data/andre_tall.json site/data/befolkning.json site/data/finans.json site/data/bolig.json site/data/arbeid.json site/data/naering.json site/data/sammenhenger.json site/sak site/utgifter site/sitemap.xml
          if git diff --cached --quiet; then
            echo "Ingen endringer i dataene."
          else
            git commit -m "Oppdater data fra SSB"
            git push
          fi
